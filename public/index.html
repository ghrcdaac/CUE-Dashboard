<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/nasa_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CUE Dashboard"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/nasa_logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>CUE Dashboard</title>
    <!-- WCAG F24: whenever a text color is set, the background is set too, so custom
         browser colors (e.g. white on black) can't leave text unreadable. -->
    <style>
      body { margin: 0; color: #212121; background-color: #ffffff; }
    </style>
  </head>
  <body>
    <!-- Loading page. React replaces everything inside #root as soon as the app starts, so
         people see this only for a moment (or always, without JavaScript). It is real HTML
         (not <noscript>, which scanners such as SortSite read as plain text), so tools that
         read this file without running the app still find a heading and the ways to reach
         every page (WCAG 2.4.5 Multiple Ways). -->
    <div id="root">
      <main id="boot" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #10202d; background-color: #ffffff; line-height: 1.5;">
        <h1 style="color: #19577F; background-color: #ffffff; font-size: 1.75rem; margin: 0 0 0.5rem;">CUE Dashboard</h1>
        <p style="margin: 0 0 1rem; color: #10202d; background-color: #ffffff;">Loadingthe Cloud Upload Environment dashboard…</p>
        <noscript><p style="margin: 0 0 1rem; color: #10202d; background-color: #ffffff;">You need to enable JavaScript to run this app.</p></noscript>
        <nav aria-label="Pages">
          <ul style="padding-left: 1.25rem; margin: 0;">
            <li><a href="/" style="color: #19577F; background-color: #ffffff;">Home</a></li>
            <li><a href="/sitemap" style="color: #19577F; background-color: #ffffff;">Site map</a></li>
            <li><a href="/collections" style="color: #19577F; background-color: #ffffff;">Collections</a></li>
            <li><a href="/providers" style="color: #19577F; background-color: #ffffff;">Providers</a></li>
            <li><a href="/metrics" style="color: #19577F; background-color: #ffffff;">Metrics</a></li>
            <li><a href="/users" style="color: #19577F; background-color: #ffffff;">Users</a></li>
            <li><a href="/daac" style="color: #19577F; background-color: #ffffff;">DAAC</a></li>
            <li><a href="/profile" style="color: #19577F; background-color: #ffffff;">Profile</a></li>
          </ul>
        </nav>
      </main>
    </div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
